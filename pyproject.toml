[project]
name = "docbooklm"
version = "0.1.0"
description = "DocBooK LM: NotebookLM locale su llama.cpp Vulkan (iMac Pro, Vega 64)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.9",
  "pypdfium2>=4.30",
  "pillow>=10.4",
  "python-docx>=1.1",
  "numpy>=2.1",
  "fpdf2>=2.8",
  "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.7",
  "mypy>=1.13",
]

[project.scripts]
docbooklm-api = "docbooklm.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docbooklm"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI richiede File()/Form() come valore di default degli argomenti
"src/docbooklm/api.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
mypy_path = "src"
files = ["src"]

[[tool.mypy.overrides]]
module = ["docbooklm.extract.ocr", "docbooklm.extract.pdf_boxes"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "docx.*", "Quartz.*", "Vision.*", "Foundation.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
